name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build a fresh demo site
        run: |
          npx tsc
          node dist/cli/index.js init /tmp/smoke-memory
          node dist/cli/index.js new project "Smoke test" --source /tmp/smoke-memory
          node dist/cli/index.js build --source /tmp/smoke-memory --out /tmp/smoke-site --mode public
          node dist/cli/index.js validate --source /tmp/smoke-memory
      - name: Assert no private notes ship in the public manifest
        run: |
          # Inspect manifest metadata, NOT free-text — starter procedure notes
          # legitimately use the phrase "visibility: private" in prose.
          node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/smoke-site/manifest.json','utf8'));const leak=m.notes.find(n=>n.visibility==='private'||n.visibility==='team');if(leak){console.error('Private/team note in manifest:',leak);process.exit(1)}console.log('OK: '+m.notes.length+' notes, none private/team')"
      - name: Plant a private note + rebuild + assert it is excluded
        run: |
          mkdir -p /tmp/smoke-memory/projects
          cat > /tmp/smoke-memory/projects/secret.md <<'NOTE'
          ---
          title: "Operation Salted Caramel"
          visibility: private
          sensitivity: none
          ---
          # Operation Salted Caramel
          Top secret.
          NOTE
          # Reference the private note from the public smoke-test note.
          echo '' >> /tmp/smoke-memory/projects/smoke-test.md
          echo 'See [[Operation Salted Caramel]].' >> /tmp/smoke-memory/projects/smoke-test.md
          node dist/cli/index.js build --source /tmp/smoke-memory --out /tmp/smoke-site --mode public --force
          # The title MUST NOT appear in any output artifact (incl. HTML, chunks, search-index, llms.txt).
          if grep -r "Operation Salted Caramel" /tmp/smoke-site/; then
            echo "Private title leaked through wiki-link in public build"
            exit 1
          fi
          echo "OK: private title fully redacted in public build"
      - name: CLI version smoke
        run: node dist/cli/index.js --version
