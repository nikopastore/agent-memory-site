name: Release to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # for `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Check if version is already published
        id: check
        run: |
          local_version=$(node -p "require('./package.json').version")
          remote_version=$(npm view "agent-memory-site@$local_version" version 2>/dev/null || true)
          if [ "$remote_version" = "$local_version" ]; then
            echo "Version $local_version is already on npm — skipping publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        if: steps.check.outputs.already_published == 'false' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" = "" ] || [ "$tag" = "$GITHUB_REF" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-from-tag
